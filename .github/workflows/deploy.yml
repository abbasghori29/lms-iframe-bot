name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "❌ Error: EC2_SSH_KEY secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "❌ Error: EC2_HOST secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "❌ Error: EC2_USER secret is not set"
            exit 1
          fi
          echo "✅ All required secrets are set"
          echo "📍 Connecting to: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          APP_DIR: ${{ secrets.EC2_APP_DIR || '/home/ec2-user/lms-bot' }}
          FRONTEND_DOMAIN: ${{ secrets.FRONTEND_DOMAIN || 'api.onlinece.ca' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          REPO_URL: ${{ github.event.repository.clone_url }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USER" ]; then
            echo "❌ Error: EC2_HOST or EC2_USER is empty"
            echo "EC2_HOST: ${EC2_HOST:-'NOT SET'}"
            echo "EC2_USER: ${EC2_USER:-'NOT SET'}"
            exit 1
          fi
          echo "🔗 Connecting to $EC2_USER@$EC2_HOST..."
          
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            $EC2_USER@$EC2_HOST \
            "export APP_DIR='${APP_DIR:-/home/ec2-user/lms-bot}' && \
             export REPO_URL='$REPO_URL' && \
             export FRONTEND_DOMAIN='$FRONTEND_DOMAIN' && \
             export GROQ_KEY='$GROQ_API_KEY' && \
             export OPENAI_KEY='$OPENAI_API_KEY' && \
             export PINECONE_KEY='$PINECONE_API_KEY' && \
             export EC2_USER_NAME='$EC2_USER' && \
             bash" << 'DEPLOY_SCRIPT'
          set -e
          
          echo "🚀 Starting automated setup and deployment..."
          
          # Detect OS and install prerequisites
          if [ -f /etc/os-release ]; then
            . /etc/os-release
            OS=$ID
          else
            echo "⚠️  Cannot detect OS, assuming Amazon Linux"
            OS="amzn"
          fi
          
          echo "📦 Installing system prerequisites for $OS..."
          
          if [ "$OS" = "amzn" ] || [ "$OS" = "rhel" ] || [ "$OS" = "centos" ]; then
            # Amazon Linux / RHEL / CentOS
            sudo yum update -y
            sudo yum install -y git python3.11 python3.11-pip python3.11-devel gcc gcc-c++ make cmake nginx openssl augeas-libs
            
            # Install Docker
            if ! command -v docker &> /dev/null; then
              echo "🐳 Installing Docker..."
              sudo yum install -y docker
              sudo systemctl enable docker
              sudo systemctl start docker
              sudo usermod -aG docker $EC2_USER_NAME || sudo usermod -aG docker $(whoami)
            fi
            
            # Install Docker Compose
            if ! command -v docker-compose &> /dev/null; then
              echo "🐳 Installing Docker Compose..."
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi
            
            # Install certbot
            sudo pip3 install certbot certbot-nginx 2>/dev/null || echo "⚠️  Certbot pip install failed, trying yum..."
            sudo yum install -y certbot python3-certbot-nginx 2>/dev/null || echo "⚠️  Certbot yum install failed"
            
            # Try to install ffmpeg if available
            sudo yum install -y ffmpeg ffmpeg-devel 2>/dev/null || echo "⚠️  ffmpeg not available in default repos, skipping"
          elif [ "$OS" = "ubuntu" ] || [ "$OS" = "debian" ]; then
            # Ubuntu / Debian
            sudo apt-get update -y
            sudo apt-get install -y git python3.11 python3.11-venv python3.11-dev python3-pip build-essential gcc g++ make cmake nginx openssl certbot python3-certbot-nginx
            
            # Install Docker
            if ! command -v docker &> /dev/null; then
              echo "🐳 Installing Docker..."
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
              sudo usermod -aG docker $EC2_USER_NAME || sudo usermod -aG docker $(whoami)
              rm get-docker.sh
            fi
            
            # Install Docker Compose
            if ! command -v docker-compose &> /dev/null; then
              echo "🐳 Installing Docker Compose..."
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi
            
            sudo apt-get install -y ffmpeg libavcodec-dev libavformat-dev libavutil-dev 2>/dev/null || echo "⚠️  ffmpeg installation failed, continuing"
          else
            echo "⚠️  Unknown OS, trying to install basic packages..."
            sudo yum install -y git python3 python3-pip nginx openssl 2>/dev/null || sudo apt-get install -y git python3 python3-pip nginx openssl 2>/dev/null || true
          fi
          
          # Verify Python is available
          if command -v python3.11 &> /dev/null; then
            PYTHON_CMD=python3.11
          elif command -v python3 &> /dev/null; then
            PYTHON_CMD=python3
          else
            echo "❌ Python not found!"
            exit 1
          fi
          
          echo "✅ Python found: $PYTHON_CMD"
          $PYTHON_CMD --version
          
          # Verify Docker is installed and running
          if ! command -v docker &> /dev/null; then
            echo "❌ Docker not found!"
            exit 1
          fi
          sudo systemctl start docker || true
          echo "✅ Docker installed and running"
          docker --version
          docker-compose --version
          
          # Create directory if it doesn't exist
          if [ ! -d "$APP_DIR" ]; then
            echo "📁 Creating application directory: $APP_DIR"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            
            echo "📥 Cloning repository (first time setup)..."
            git clone "$REPO_URL" .
          else
            echo "📂 Directory exists, updating code..."
            cd "$APP_DIR"
            
            echo "🔄 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main
          fi
          
          echo "📝 Creating/updating backend .env file..."
          SECRET_RANDOM=$(openssl rand -hex 32)
          cat > .env << EOF
          # Application Settings
          PROJECT_NAME=LMS Bot
          VERSION=0.1.0
          DEBUG=False
          HOST=127.0.0.1
          PORT=8005
          
          # Database
          DATABASE_URL=sqlite:///./app.db
          DB_ECHO=False
          
          # Security
          SECRET_KEY=change-this-in-production-$SECRET_RANDOM
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          
          # CORS (only localhost since backend is not exposed)
          BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
          
          # Logging
          LOG_LEVEL=INFO
          LOG_FORMAT=json
          
          # LLM / AI
          GROQ_API_KEY=$GROQ_KEY
          OPENAI_API_KEY=$OPENAI_KEY
          VECTOR_STORE_PATH=faiss_index_openai
          EMBEDDING_API_URL=https://lamhieu-lightweight-embeddings.hf.space/v1/embeddings
          EMBEDDING_MODEL=bge-m3
          
          # Pinecone Vector Database
          PINECONE_API_KEY=$PINECONE_KEY
          PINECONE_INDEX_NAME=cafs-chatbot-memory
          PINECONE_CLOUD=aws
          PINECONE_REGION=us-east-1
          
          # Speech-to-Text
          WHISPER_MODEL=base
          EOF
          chmod 600 .env
          
          echo "📦 Setting up backend virtual environment..."
          if [ ! -d "venv" ]; then
            echo "🐍 Creating virtual environment..."
            $PYTHON_CMD -m venv venv
          fi
          
          echo "📦 Activating virtual environment..."
          source venv/bin/activate
          
          echo "📥 Installing/updating backend dependencies..."
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          
          echo "📚 Checking vector store..."
          if [ ! -d "faiss_index_openai" ]; then
            echo "⚠️  Vector store (faiss_index_openai) not found!"
            if [ -f "FIC-CSI-EN-2025.pdf" ] && [ -f "PDF complet de CSI.pdf" ]; then
              echo "📄 PDF files found, creating vector store (this will take several minutes)..."
              echo "   This is a one-time process that creates embeddings from PDFs."
              python train_vector_db_openai.py || echo "⚠️  Vector store creation failed, but continuing deployment"
            else
              echo "❌ ERROR: Vector store not found and PDF files are missing!"
              echo "   The chatbot will not work without the vector store."
            fi
          else
            echo "✅ Vector store found"
          fi
          
          echo "⚙️  Setting up backend systemd service (localhost only)..."
          SERVICE_USER=${EC2_USER_NAME:-$(whoami)}
          sudo tee /etc/systemd/system/lms-bot.service > /dev/null << SERVICE_EOF
          [Unit]
          Description=LMS Bot FastAPI Application (Localhost Only)
          After=network.target
          
          [Service]
          Type=simple
          User=$SERVICE_USER
          Group=$SERVICE_USER
          WorkingDirectory=$APP_DIR
          Environment="PATH=$APP_DIR/venv/bin"
          ExecStart=$APP_DIR/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8005 --workers 4
          Restart=always
          RestartSec=10
          StandardOutput=journal
          StandardError=journal
          
          # Security settings
          NoNewPrivileges=true
          PrivateTmp=true
          
          [Install]
          WantedBy=multi-user.target
          SERVICE_EOF
          
          # Reload systemd and enable/start backend service
          sudo systemctl daemon-reload
          sudo systemctl enable lms-bot
          sudo systemctl restart lms-bot
          
          echo "🐳 Building and deploying frontend with Docker..."
          cd "$APP_DIR/frontend"
          
          # Stop and remove existing container if it exists
          docker-compose down 2>/dev/null || true
          
          # Build and start frontend container
          docker-compose build --no-cache
          docker-compose up -d
          
          # Wait for frontend to be ready
          echo "⏳ Waiting for frontend to start..."
          sleep 10
          
          # Check if frontend container is running
          if docker ps | grep -q cafs-frontend; then
            echo "✅ Frontend container is running"
          else
            echo "❌ Frontend container failed to start"
            docker-compose logs
            exit 1
          fi
          
          echo "🔒 Setting up SSL/HTTPS with Nginx + Certbot for $FRONTEND_DOMAIN..."
          
          # Remove default nginx config if it exists
          sudo rm -f /etc/nginx/conf.d/default.conf
          
          # Create Nginx config for frontend + API proxy
          echo "📝 Creating Nginx configuration for $FRONTEND_DOMAIN..."
          sudo tee /etc/nginx/conf.d/lms-bot.conf > /dev/null << NGINX_EOF
          # Frontend + API Proxy Configuration
          server {
              listen 80;
              server_name $FRONTEND_DOMAIN;
              
              client_max_body_size 10M;
              
              # Proxy API requests to backend (localhost:8005)
              location /api {
                  proxy_pass http://127.0.0.1:8005;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_set_header X-Forwarded-Host \$host;
                  proxy_set_header X-Forwarded-Port \$server_port;
                  proxy_connect_timeout 60s;
                  proxy_send_timeout 60s;
                  proxy_read_timeout 60s;
              }
              
              # Proxy WebSocket for streaming
              location /api/v1/chat/stream {
                  proxy_pass http://127.0.0.1:8005;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_read_timeout 300s;
                  proxy_send_timeout 300s;
              }
              
              # Health check endpoint
              location /health {
                  proxy_pass http://127.0.0.1:8005/health;
                  proxy_set_header Host \$host;
              }
              
              # Serve frontend (Next.js on port 3000)
              location / {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_set_header X-Forwarded-Host \$host;
                  proxy_set_header X-Forwarded-Port \$server_port;
              }
          }
          NGINX_EOF
          
          # Test and start Nginx with HTTP config
          sudo nginx -t || echo "⚠️  Nginx configuration test failed"
          sudo systemctl enable nginx
          sudo systemctl restart nginx || echo "⚠️  Nginx restart failed"
          
          # Run Certbot to get SSL certificate
          echo "🔐 Running Certbot for $FRONTEND_DOMAIN..."
          if [ -d "/etc/letsencrypt/live/$FRONTEND_DOMAIN" ]; then
            echo "✅ SSL certificate already exists for $FRONTEND_DOMAIN, attempting renewal..."
            sudo certbot renew --quiet --non-interactive || echo "⚠️  Renewal not needed or failed"
            sudo certbot --nginx -d $FRONTEND_DOMAIN --non-interactive --agree-tos --email admin@onlinece.ca --redirect --keep-until-expiring || echo "⚠️  Certbot reconfigure failed"
          else
            echo "🆕 Getting new SSL certificate for $FRONTEND_DOMAIN..."
            sudo certbot --nginx -d $FRONTEND_DOMAIN --non-interactive --agree-tos --email admin@onlinece.ca --redirect || echo "⚠️  Certbot failed - check DNS and try again"
          fi
          
          # Verify final Nginx config and restart
          sudo nginx -t || echo "⚠️  Nginx configuration test failed after Certbot"
          sudo systemctl reload nginx || sudo systemctl restart nginx || echo "⚠️  Nginx restart failed"
          
          # Configure firewall (if firewalld is running)
          if systemctl is-active --quiet firewalld; then
            echo "🔥 Configuring firewall for HTTPS..."
            sudo firewall-cmd --permanent --add-service=https 2>/dev/null || true
            sudo firewall-cmd --permanent --add-service=http 2>/dev/null || true
            sudo firewall-cmd --reload 2>/dev/null || true
          fi
          
          echo "✅ Deployment completed!"
          echo "📊 Service status:"
          sudo systemctl status lms-bot --no-pager -l || echo "⚠️  Backend service status unavailable"
          echo ""
          docker ps | grep cafs-frontend || echo "⚠️  Frontend container status unavailable"
          
          echo ""
          echo "📋 Checking backend logs (last 20 lines) for errors:"
          sudo journalctl -u lms-bot -n 20 --no-pager || echo "⚠️  Could not read logs"
          
          echo ""
          echo "📋 Checking frontend logs (last 20 lines) for errors:"
          docker-compose -f "$APP_DIR/frontend/docker-compose.yml" logs --tail=20 || echo "⚠️  Could not read frontend logs"
          
          echo ""
          echo "🔍 Checking if backend port 8005 is listening (localhost only):"
          sudo netstat -tulpn | grep 8005 || sudo ss -tulpn | grep 8005 || echo "⚠️  Port 8005 not found in listening ports"
          
          echo ""
          echo "🔍 Checking if frontend port 3000 is listening:"
          sudo netstat -tulpn | grep 3000 || sudo ss -tulpn | grep 3000 || echo "⚠️  Port 3000 not found in listening ports"
          
          echo ""
          echo "🌐 Application is available at:"
          echo "   - HTTPS: https://$FRONTEND_DOMAIN (Frontend + API via /api)"
          echo "   - Backend: http://127.0.0.1:8005 (Localhost only, not exposed)"
          echo ""
          echo "🔐 SSL Certificate: Let's Encrypt (auto-renewing via Certbot)"
          echo ""
          echo "⚠️  IMPORTANT: Make sure your EC2 Security Group allows inbound traffic on:"
          echo "   - Port 443 (HTTPS) - Type: HTTPS, Source: 0.0.0.0/0"
          echo "   - Port 80 (HTTP redirect) - Type: HTTP, Source: 0.0.0.0/0"
          echo "   - DO NOT expose port 8005 to the internet (backend is localhost only)"
          DEPLOY_SCRIPT

      - name: Health Check
        continue-on-error: true
        timeout-minutes: 2
        env:
          FRONTEND_DOMAIN: ${{ secrets.FRONTEND_DOMAIN || 'api.onlinece.ca' }}
        run: |
          echo "⏳ Waiting for application to start..."
          sleep 20
          echo "🏥 Checking application health..."
          echo "📍 Attempting to connect to https://$FRONTEND_DOMAIN/health (HTTPS)"
          curl -v --max-time 10 --connect-timeout 5 https://$FRONTEND_DOMAIN/health && echo "✅ HTTPS health check passed!" || echo "⚠️  HTTPS health check failed"
          echo "📍 Attempting to connect to https://$FRONTEND_DOMAIN (Frontend)"
          curl -v --max-time 10 --connect-timeout 5 https://$FRONTEND_DOMAIN && echo "✅ Frontend check passed!" || echo "⚠️  Frontend check failed - Check: 1) Security group allows ports 443/80, 2) Service logs for errors, 3) Application is running"
