name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "❌ Error: EC2_SSH_KEY secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "❌ Error: EC2_HOST secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "❌ Error: EC2_USER secret is not set"
            exit 1
          fi
          echo "✅ All required secrets are set"
          echo "📍 Connecting to: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          APP_DIR: ${{ secrets.EC2_APP_DIR || '/home/ec2-user/lms-bot' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          REPO_URL: ${{ github.event.repository.clone_url }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USER" ]; then
            echo "❌ Error: EC2_HOST or EC2_USER is empty"
            echo "EC2_HOST: ${EC2_HOST:-'NOT SET'}"
            echo "EC2_USER: ${EC2_USER:-'NOT SET'}"
            exit 1
          fi
          echo "🔗 Connecting to $EC2_USER@$EC2_HOST..."
          
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            $EC2_USER@$EC2_HOST \
            "export APP_DIR='${APP_DIR:-/home/ec2-user/lms-bot}' && \
             export REPO_URL='$REPO_URL' && \
             export GROQ_KEY='$GROQ_API_KEY' && \
             export OPENAI_KEY='$OPENAI_API_KEY' && \
             export PINECONE_KEY='$PINECONE_API_KEY' && \
             export EC2_USER_NAME='$EC2_USER' && \
             bash" << 'DEPLOY_SCRIPT'
          set -e
          
          echo "🚀 Starting automated setup and deployment..."
          
          # Detect OS and install prerequisites
          if [ -f /etc/os-release ]; then
            . /etc/os-release
            OS=$ID
          else
            echo "⚠️  Cannot detect OS, assuming Amazon Linux"
            OS="amzn"
          fi
          
          echo "📦 Installing system prerequisites for $OS..."
          
          if [ "$OS" = "amzn" ] || [ "$OS" = "rhel" ] || [ "$OS" = "centos" ]; then
            # Amazon Linux / RHEL / CentOS
            sudo yum update -y
            sudo yum install -y git python3.11 python3.11-pip python3.11-devel gcc gcc-c++ make cmake nginx openssl augeas-libs
            # Install certbot via pip (most reliable on AL2023)
            sudo pip3 install certbot certbot-nginx 2>/dev/null || echo "⚠️  Certbot pip install failed, trying yum..."
            sudo yum install -y certbot python3-certbot-nginx 2>/dev/null || echo "⚠️  Certbot yum install failed"
            # Try to install ffmpeg if available
            sudo yum install -y ffmpeg ffmpeg-devel 2>/dev/null || echo "⚠️  ffmpeg not available in default repos, skipping"
          elif [ "$OS" = "ubuntu" ] || [ "$OS" = "debian" ]; then
            # Ubuntu / Debian
            sudo apt-get update -y
            sudo apt-get install -y git python3.11 python3.11-venv python3.11-dev python3-pip build-essential gcc g++ make cmake nginx openssl certbot python3-certbot-nginx
            sudo apt-get install -y ffmpeg libavcodec-dev libavformat-dev libavutil-dev 2>/dev/null || echo "⚠️  ffmpeg installation failed, continuing"
          else
            echo "⚠️  Unknown OS, trying to install basic packages..."
            sudo yum install -y git python3 python3-pip nginx openssl 2>/dev/null || sudo apt-get install -y git python3 python3-pip nginx openssl 2>/dev/null || true
          fi
          
          # Verify Python is available
          if command -v python3.11 &> /dev/null; then
            PYTHON_CMD=python3.11
          elif command -v python3 &> /dev/null; then
            PYTHON_CMD=python3
          else
            echo "❌ Python not found!"
            exit 1
          fi
          
          echo "✅ Python found: $PYTHON_CMD"
          $PYTHON_CMD --version
          
          # Create directory if it doesn't exist
          if [ ! -d "$APP_DIR" ]; then
            echo "📁 Creating application directory: $APP_DIR"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            
            echo "📥 Cloning repository (first time setup)..."
            git clone "$REPO_URL" .
          else
            echo "📂 Directory exists, updating code..."
            cd "$APP_DIR"
            
            echo "🔄 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main
          fi
          
          echo "📝 Creating/updating .env file..."
          SECRET_RANDOM=$(openssl rand -hex 32)
          # Get EC2 public IP for CORS
          EC2_IP_FOR_CORS=$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4 2>/dev/null || echo 'localhost')
          cat > .env << EOF
          # Application Settings
          PROJECT_NAME=LMS Bot
          VERSION=0.1.0
          DEBUG=False
          HOST=0.0.0.0
          PORT=8005
          
          # Database
          DATABASE_URL=sqlite:///./app.db
          DB_ECHO=False
          
          # Security
          SECRET_KEY=change-this-in-production-$SECRET_RANDOM
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          
          # CORS (includes HTTPS domain for microphone access)
          BACKEND_CORS_ORIGINS=["https://api.onlinece.ca","https://$EC2_IP_FOR_CORS","http://localhost:3000","http://localhost:8005"]
          
          # Logging
          LOG_LEVEL=INFO
          LOG_FORMAT=json
          
          # LLM / AI
          GROQ_API_KEY=$GROQ_KEY
          OPENAI_API_KEY=$OPENAI_KEY
          VECTOR_STORE_PATH=faiss_index_openai
          EMBEDDING_API_URL=https://lamhieu-lightweight-embeddings.hf.space/v1/embeddings
          EMBEDDING_MODEL=bge-m3
          
          # Pinecone Vector Database
          PINECONE_API_KEY=$PINECONE_KEY
          PINECONE_INDEX_NAME=cafs-chatbot-memory
          PINECONE_CLOUD=aws
          PINECONE_REGION=us-east-1
          
          # Speech-to-Text
          WHISPER_MODEL=base
          EOF
          chmod 600 .env
          
          echo "📦 Setting up virtual environment..."
          if [ ! -d "venv" ]; then
            echo "🐍 Creating virtual environment..."
            $PYTHON_CMD -m venv venv
          fi
          
          echo "📦 Activating virtual environment..."
          source venv/bin/activate
          
          echo "📥 Installing/updating dependencies..."
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          
          echo "📚 Checking vector store..."
          if [ ! -d "faiss_index_openai" ]; then
            echo "⚠️  Vector store (faiss_index_openai) not found!"
            if [ -f "FIC-CSI-EN-2025.pdf" ] && [ -f "PDF complet de CSI.pdf" ]; then
              echo "📄 PDF files found, creating vector store (this will take several minutes)..."
              echo "   This is a one-time process that creates embeddings from PDFs."
              python train_vector_db_openai.py || echo "⚠️  Vector store creation failed, but continuing deployment"
            else
              echo "❌ ERROR: Vector store not found and PDF files are missing!"
              echo "   The chatbot will not work without the vector store."
              echo "   You need to either:"
              echo "   1. Upload the faiss_index_openai directory to EC2, or"
              echo "   2. Upload PDF files and run: python train_vector_db_openai.py"
            fi
          else
            echo "✅ Vector store found"
          fi
          
          echo "⚙️  Setting up systemd service..."
          # Use the EC2 user from environment
          SERVICE_USER=${EC2_USER_NAME:-$(whoami)}
          # Create systemd service file
          sudo tee /etc/systemd/system/lms-bot.service > /dev/null << SERVICE_EOF
          [Unit]
          Description=LMS Bot FastAPI Application
          After=network.target
          
          [Service]
          Type=simple
          User=$SERVICE_USER
          Group=$SERVICE_USER
          WorkingDirectory=$APP_DIR
          Environment="PATH=$APP_DIR/venv/bin"
          ExecStart=$APP_DIR/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8005 --workers 4
          Restart=always
          RestartSec=10
          StandardOutput=journal
          StandardError=journal
          
          # Security settings
          NoNewPrivileges=true
          PrivateTmp=true
          
          [Install]
          WantedBy=multi-user.target
          SERVICE_EOF
          
          # Set up SSL/HTTPS with Nginx + Certbot (api.onlinece.ca)
          DOMAIN="api.onlinece.ca"
          echo "🔒 Setting up SSL/HTTPS with Nginx + Certbot for $DOMAIN..."
          
          # Remove default nginx config if it exists (conflicts with port 80)
          sudo rm -f /etc/nginx/conf.d/default.conf
          
          # Step 1: Create initial HTTP-only Nginx config (needed for Certbot verification)
          echo "📝 Creating initial Nginx configuration for $DOMAIN..."
          sudo tee /etc/nginx/conf.d/lms-bot.conf > /dev/null << 'NGINX_EOF'
          server {
              listen 80;
              server_name api.onlinece.ca;
              
              client_max_body_size 10M;
              
              location / {
                  proxy_pass http://127.0.0.1:8005;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header X-Forwarded-Host $host;
                  proxy_set_header X-Forwarded-Port $server_port;
                  proxy_connect_timeout 60s;
                  proxy_send_timeout 60s;
                  proxy_read_timeout 60s;
              }
              
              location /ws {
                  proxy_pass http://127.0.0.1:8005;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINX_EOF
          
          # Test and start Nginx with HTTP config
          sudo nginx -t || echo "⚠️  Nginx configuration test failed"
          sudo systemctl enable nginx
          sudo systemctl restart nginx || echo "⚠️  Nginx restart failed"
          
          # Step 2: Run Certbot to get real SSL certificate
          echo "🔐 Running Certbot for $DOMAIN..."
          if [ -d "/etc/letsencrypt/live/$DOMAIN" ]; then
            echo "✅ SSL certificate already exists for $DOMAIN, attempting renewal..."
            sudo certbot renew --quiet --non-interactive || echo "⚠️  Renewal not needed or failed"
            # Re-apply nginx plugin to ensure config is correct
            sudo certbot --nginx -d $DOMAIN --non-interactive --agree-tos --email admin@onlinece.ca --redirect --keep-until-expiring || echo "⚠️  Certbot reconfigure failed"
          else
            echo "🆕 Getting new SSL certificate for $DOMAIN..."
            sudo certbot --nginx -d $DOMAIN --non-interactive --agree-tos --email admin@onlinece.ca --redirect || echo "⚠️  Certbot failed - check DNS and try again"
          fi
          
          # Step 3: Set up auto-renewal (Certbot already sets up a systemd timer on AL2023)
          echo "🔄 Checking certificate auto-renewal..."
          sudo systemctl list-timers | grep certbot || echo "ℹ️  Certbot auto-renewal timer not found, but Certbot scheduled task is already set up"
          
          # Step 4: Verify final Nginx config and restart
          sudo nginx -t || echo "⚠️  Nginx configuration test failed after Certbot"
          sudo systemctl reload nginx || sudo systemctl restart nginx || echo "⚠️  Nginx restart failed"
          
          # Configure firewall (if firewalld is running)
          if systemctl is-active --quiet firewalld; then
            echo "🔥 Configuring firewall for HTTPS..."
            sudo firewall-cmd --permanent --add-service=https 2>/dev/null || true
            sudo firewall-cmd --permanent --add-service=http 2>/dev/null || true
            sudo firewall-cmd --reload 2>/dev/null || true
          fi
          
          # Reload systemd and enable/start service
          sudo systemctl daemon-reload
          sudo systemctl enable lms-bot
          sudo systemctl restart lms-bot
          
          echo "✅ Deployment completed!"
          echo "📊 Service status:"
          sudo systemctl status lms-bot --no-pager -l || echo "⚠️  Service status unavailable"
          
          echo ""
          echo "📋 Checking service logs (last 30 lines) for errors:"
          sudo journalctl -u lms-bot -n 30 --no-pager || echo "⚠️  Could not read logs"
          
          echo ""
          echo "🔍 Checking if port 8005 is listening:"
          sudo netstat -tulpn | grep 8005 || sudo ss -tulpn | grep 8005 || echo "⚠️  Port 8005 not found in listening ports"
          
          echo ""
          echo "📁 Checking vector store directory:"
          if [ -d "$APP_DIR/faiss_index_openai" ]; then
            echo "✅ Vector store directory exists"
            ls -la "$APP_DIR/faiss_index_openai" | head -5
          else
            echo "❌ WARNING: Vector store directory (faiss_index_openai) not found!"
            echo "   The chatbot will not work without the vector store."
            echo "   You need to either:"
            echo "   1. Upload faiss_index_openai directory to EC2, or"
            echo "   2. Run train_vector_db_openai.py on EC2 to create it"
          fi
          
          echo ""
          echo "🔑 Checking environment variables:"
          if [ -f "$APP_DIR/.env" ]; then
            echo "✅ .env file exists"
            if grep -q "GROQ_API_KEY=" "$APP_DIR/.env" && ! grep -q "GROQ_API_KEY=$" "$APP_DIR/.env" && ! grep -q "GROQ_API_KEY=your-" "$APP_DIR/.env"; then
              echo "✅ GROQ_API_KEY appears to be set"
            else
              echo "❌ WARNING: GROQ_API_KEY may not be set correctly"
            fi
          else
            echo "❌ .env file not found!"
          fi
          
          echo ""
          echo "🌐 Application is available at:"
          echo "   - HTTPS: https://api.onlinece.ca (recommended - microphone will work)"
          echo "   - HTTP:  http://api.onlinece.ca:8005 (direct, microphone won't work)"
          echo ""
          echo "🔐 SSL Certificate: Let's Encrypt (auto-renewing via Certbot)"
          echo ""
          echo "⚠️  IMPORTANT: Make sure your EC2 Security Group allows inbound traffic on:"
          echo "   - Port 443 (HTTPS) - Type: HTTPS, Source: 0.0.0.0/0"
          echo "   - Port 80 (HTTP redirect) - Type: HTTP, Source: 0.0.0.0/0"
          echo "   - Port 8005 (optional, direct access) - Type: Custom TCP, Source: 0.0.0.0/0"
          DEPLOY_SCRIPT

      - name: Health Check
        continue-on-error: true
        timeout-minutes: 2
        run: |
          echo "⏳ Waiting for application to start..."
          sleep 15
          echo "🏥 Checking application health..."
          echo "📍 Attempting to connect to https://api.onlinece.ca/health (HTTPS)"
          curl -v --max-time 10 --connect-timeout 5 https://api.onlinece.ca/health && echo "✅ HTTPS health check passed!" || echo "⚠️  HTTPS health check failed, trying HTTP..."
          curl -v --max-time 10 --connect-timeout 5 http://${{ secrets.EC2_HOST }}:8005/health && echo "✅ HTTP health check passed!" || echo "⚠️  Health check failed - Check: 1) Security group allows ports 443/80, 2) Service logs for errors, 3) Application is running"
